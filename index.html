    <!-- Google Fonts: Plus Jakarta Sans + Noto Sans Bengali + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Schema.org Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Md. Solaiman Hossain",
        "jobTitle": "AI Enthusiast, Web Development Learner & Creative Digital Creator",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Sirajganj",
          "addressCountry": "Bangladesh"
        },
        "alumniOf": {
          "@type": "CollegeOrUniversity",
          "name": "Islamia Government College, Sirajganj"
        },
        "knowsAbout": [
          "Artificial Intelligence Tools",
          "Prompt Engineering",
          "HTML",
          "CSS",
          "JavaScript",
          "Google AI Studio",
          "Google Stitch",
          "Automation Tools"
        ]
      }
    </script>

    <!-- Initial Theme Sync -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('portfolio_theme');
          var root = document.documentElement;
          if (saved === 'light') {
            root.classList.remove('dark');
          } else {
            root.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>

  <body class="bg-slate-50 text-slate-900 dark:bg-[#060B18] dark:text-slate-100 antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
